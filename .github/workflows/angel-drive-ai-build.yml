name: Build Angel Drive AI APK

on:
  push:
    branches: [ angel-drive-ai-box-mvp ]
    paths:
      - 'angel-drive-ai/**'
      - '.github/workflows/angel-drive-ai-build.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'angel-drive-ai/**'
      - '.github/workflows/angel-drive-ai-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: angel-drive-ai
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare artifact
        run: |
          mkdir -p artifact
          cp angel-drive-ai/app/build/outputs/apk/debug/app-debug.apk artifact/AngelDriveAI-v0.3.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AngelDriveAI-v0.3-APK
          path: artifact/AngelDriveAI-v0.3.apk
          retention-days: 30
