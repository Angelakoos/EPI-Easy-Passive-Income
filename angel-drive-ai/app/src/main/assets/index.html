<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Ángel Drive AI</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--bronze:#c78b64;--glass:rgba(8,11,15,.88);--text:#f5f7fa;--muted:#b9bec7}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070a;color:var(--text);font-family:Roboto,Arial,sans-serif}#map{position:absolute;inset:0;background:radial-gradient(circle at 50% 42%,#172132,#030508 70%)}#map .leaflet-tile{filter:grayscale(1) brightness(.31) contrast(1.45)}.leaflet-control-attribution{display:none}.fallback{position:absolute;inset:0;opacity:.3;background-image:linear-gradient(28deg,transparent 48%,#344152 49%,transparent 51%),linear-gradient(108deg,transparent 48%,#283443 49%,transparent 51%);background-size:100px 100px,130px 130px;pointer-events:none}.card,.dock,.pill{background:linear-gradient(145deg,rgba(14,17,22,.96),rgba(5,8,11,.84));border:1px solid rgba(231,181,143,.24);box-shadow:0 15px 45px rgba(0,0,0,.45);backdrop-filter:blur(18px)}.nav{position:absolute;left:3vw;top:4vh;width:27vw;min-width:320px;border-radius:22px;padding:2.3vh 2vw}.turn{display:flex;gap:1.3vw}.arrow{font-size:5vh}.distance{font-size:2.5vh;font-weight:700}.road{font-size:2.2vh;margin-top:.7vh}.next{margin-top:2vh;padding-top:1.4vh;border-top:1px solid #ffffff18;color:#c9ced5;font-size:1.8vh}.media{position:absolute;right:3vw;top:4vh;width:31vw;min-width:390px;border-radius:22px;padding:1.6vh 1.5vw}.media-title{display:flex;align-items:center;gap:.6vw;font-size:1.6vh}.spot{width:1.8vh;height:1.8vh;border-radius:50%;background:#1ed760}.media-main{display:grid;grid-template-columns:7vh 1fr;gap:1vw;align-items:center;margin-top:1vh}.album{width:7vh;height:7vh;border-radius:10px;background:radial-gradient(circle,#dfa54d 0 10%,#111722 11% 37%,#d9a044 38% 41%,#080b0f 42%)}.track{font-size:2vh;font-weight:700}.artist{font-size:1.55vh;color:#c2c7ce;margin-top:.4vh}.progress{height:3px;background:#ffffff2b;border-radius:99px;margin-top:1.2vh}.progress div{height:100%;width:35%;background:linear-gradient(90deg,var(--bronze),white)}.times{display:flex;justify-content:space-between;font-size:1.25vh;color:#c4c9d0;margin-top:.4vh}.controls{display:flex;justify-content:center;gap:4vw;margin-top:.3vh}.controls button{border:0;background:transparent;color:white;font-size:2.8vh}.controls .play{width:5vh;height:5vh;border-radius:50%;background:#f2f2f2;color:#111}.trip{position:absolute;left:3vw;bottom:14vh;border-radius:20px;padding:1.3vh 1.6vw;display:flex;gap:2.2vw}.value{font-size:2.2vh;font-weight:700}.label{font-size:1.3vh;color:#c0c5cc;margin-top:.25vh}.speed{position:absolute;left:50%;bottom:14vh;transform:translateX(-50%);padding:.8vh 1vw;border-radius:17px;background:#05080cbc;border:1px solid #6aa7ff33;font-size:1.45vh}.dock{position:absolute;left:50%;bottom:3vh;transform:translateX(-50%);height:9vh;border-radius:28px;padding:1vh 1.2vw;display:flex;align-items:center;gap:1vw}.dock button{width:7vh;height:7vh;border:0;border-radius:22px;background:#ffffff10;color:white;font-size:3vh}.dock .waze{background:#35aee8}.dock .spotify{background:#1ed760;color:#07110a}.dock .settings{background:#ffffff20}.status{position:absolute;right:3vw;bottom:4.3vh;border-radius:28px;padding:1.2vh 1.5vw;display:flex;gap:1vw;align-items:center;font-size:1.7vh}.modal{position:absolute;inset:0;background:#000b;display:none;align-items:center;justify-content:center;backdrop-filter:blur(8px)}.modal.show{display:flex}.panel{width:min(74vw,900px);border-radius:28px;background:#0b0f14;border:1px solid #c78b6455;padding:3vh 2.5vw}.panel h2{margin:0 0 2vh}.apps{display:grid;grid-template-columns:repeat(3,1fr);gap:1.2vw}.apps button,.setting button,.close{border:1px solid #ffffff12;background:#171c23;color:white;border-radius:18px;padding:2vh 1vw;font-size:1.8vh}.setting{display:flex;justify-content:space-between;align-items:center;padding:1.5vh 0;border-bottom:1px solid #ffffff12}.close{margin-top:2vh;background:var(--bronze);color:#111;font-weight:700}
</style>
</head>
<body>
<div id="map"><div class="fallback"></div></div>
<section class="card nav" onclick="Android.open('waze')"><div class="turn"><div class="arrow">↱</div><div><div class="distance">700 m</div><div class="road">Carrer de la Marina</div></div></div><div class="next">Luego&nbsp;&nbsp;↰</div></section>
<section class="card media" onclick="Android.open('spotify')"><div class="media-title"><span class="spot"></span>Spotify</div><div class="media-main"><div class="album"></div><div><div class="track">Keep Workin</div><div class="artist">Isle&amp;Fever</div></div></div><div class="progress"><div></div></div><div class="times"><span>1:24</span><span>3:45</span></div><div class="controls"><button onclick="event.stopPropagation();Android.media('previous')">◀</button><button class="play" onclick="event.stopPropagation();Android.media('toggle')">Ⅱ</button><button onclick="event.stopPropagation();Android.media('next')">▶</button></div></section>
<section class="card trip"><div><div class="value">19:24</div><div class="label">Llegada</div></div><div><div class="value">18</div><div class="label">min</div></div><div><div class="value">7,6</div><div class="label">km</div></div></section>
<div class="speed" id="speed">GPS · 0 km/h</div>
<nav class="dock"><button onclick="show('apps')">⠿</button><button onclick="Android.open('assistant')">◉</button><button class="waze" onclick="Android.open('waze')">◉</button><button class="spotify" onclick="Android.open('spotify')">≋</button><button class="settings" onclick="show('settings')">⚙</button></nav>
<div class="pill status"><span>▂▄▆█</span><span>4G</span><span>▯</span><span id="clock">19:06</span></div>
<div class="modal" id="apps"><div class="panel"><h2>Aplicaciones</h2><div class="apps"><button onclick="Android.open('waze')">Waze</button><button onclick="Android.open('spotify')">Spotify</button><button onclick="Android.open('maps')">Google Maps</button><button onclick="Android.open('assistant')">Asistente</button><button onclick="Android.open('settings')">Ajustes</button><button onclick="Android.open('exit')">Salir</button></div><button class="close" onclick="hide()">Cerrar</button></div></div>
<div class="modal" id="settings"><div class="panel"><h2>Ajustes de Ángel Drive AI</h2><div class="setting"><span>Permitir ubicación GPS</span><button onclick="Android.open('location')">Permitir</button></div><div class="setting"><span>Elegir como launcher de la AI Box</span><button onclick="Android.open('home')">Elegir</button></div><div class="setting"><span>Ajustes generales Android</span><button onclick="Android.open('settings')">Abrir</button></div><button class="close" onclick="hide()">Cerrar</button></div></div>
<script>
let map,marker;
function init(){if(typeof L==='undefined')return;map=L.map('map',{zoomControl:false,attributionControl:false}).setView([41.3954,2.1752],15);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);const pts=[[41.3867,2.1698],[41.389,2.1708],[41.3917,2.1722],[41.3941,2.174],[41.397,2.1764],[41.4003,2.1792]];L.polyline(pts,{color:'#087bff',weight:10,opacity:.95}).addTo(map);L.polyline(pts,{color:'#76d0ff',weight:3,opacity:.9}).addTo(map);marker=L.marker(pts[2],{icon:L.divIcon({className:'',html:'<div style="width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-bottom:42px solid #8ed8ff;filter:drop-shadow(0 5px 8px #006ce8)"></div>',iconSize:[32,42],iconAnchor:[16,30]})}).addTo(map)}
window.AngelDrive={updateLocation(lat,lon,speed,bearing){document.getElementById('speed').textContent='GPS · '+Math.round(speed)+' km/h';if(map&&marker){marker.setLatLng([lat,lon]);map.panTo([lat,lon],{animate:true,duration:.4})}},setReady(){}};
function show(id){document.getElementById(id).classList.add('show')}function hide(){document.querySelectorAll('.modal').forEach(x=>x.classList.remove('show'))}function clock(){document.getElementById('clock').textContent=new Date().toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})}setInterval(clock,1000);clock();init();
</script>
</body>
</html>
